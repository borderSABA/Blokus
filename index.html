<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Blokus ONLINE v0.5.9.2</title><link rel="stylesheet" href="style.css?v=0.5.9"></head><body>
<div id="app"><div class="titlebar"><strong>Blokus ONLINE</strong><span>v0.5.9.2</span></div>
<section id="lobby"><div class="lobbyShell"><div class="namePanel"><label for="name">プレイヤー名</label><input id="name" maxlength="16" autocomplete="off"><p id="msg"></p></div><div id="rooms" class="rooms"></div></div></section>
<section id="roomLobby" hidden><div class="waitingShell"><div class="waitingHead"><div><h1 id="roomTitle">ROOM</h1><p>参加者と設定を確認してゲームを開始します</p></div><button id="roomLeave" class="subBtn">退室</button></div><div class="waitingGrid"><div class="waitingPanel"><h2>参加者</h2><div id="waitingPlayers" class="seatList"></div></div><div class="waitingPanel" id="hostSettings"><h2>ゲーム設定</h2><div class="settingRow"><label>CPUレベル</label><select id="cpuLv"><option value="1">Lv1</option><option value="2" selected>Lv2</option><option value="3">Lv3</option></select></div><button id="addCpuBtn" class="subBtn wide">CPUを追加</button><div id="modeSetting" class="settingRow" hidden><label>2人対戦ルール</label><select id="mode"><option value="classic2">クラシック（1人2色 / 20×20）</option><option value="duo">Blokus Duo（1人1色 / 14×14）</option></select></div><div id="turnOrderSetting" class="settingRow"><label>手番順</label><select id="turnOrderMode"><option value="random">ランダム</option><option value="manual">好きな順番</option></select><div id="manualOrder" class="manualOrder" hidden></div></div><button id="startBtn" class="primaryBtn wide">ゲーム開始</button><p id="waitNote"></p></div></div></div></section>
<section id="game" hidden><div id="gamebar"><button id="leave">退出</button><strong id="turnText"></strong></div><main class="gameLayout"><aside id="playerSide"><div id="players"></div></aside><div id="boardWrap"><div id="board"></div></div><aside id="pieceSide"><div class="controls"><button id="rot">↻ 回転</button><button id="flip">⇆ 反転</button><button id="confirm" disabled>✓ 確定</button><button id="pinBtn" type="button">📍 ピン</button></div><h3>自分の残りピース <span id="remain"></span></h3><div id="pieces"></div></aside></main><div id="toast"></div><div id="modal" class="modal" hidden><div class="dialog" id="modalBody"></div></div></section></div><script src="config.js?v=0.5.9"></script><script src="app.js?v=0.5.9"></script></body></html>
